<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlightCheck</title>
  <script>
    const path = window.location.pathname;
    const repo = '/flightcheck';
    const rest = path.startsWith(repo) ? path.slice(repo.length) : window.location.pathname;
    if (rest !== '/' && rest !== '/index.html') {
      sessionStorage.setItem('gh_pages_path', rest);
      window.location.replace(repo + '/');
    } else {
      window.location.replace(repo + '/');
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
