<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FlightCheck</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: sans-serif;
      color: #fff;
    }
    #frame-wrap {
      width: 100%;
      height: 100%;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #error-msg {
      display: none;
      position: absolute;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 32px;
      text-align: center;
      background: #111;
    }
    #error-msg p { opacity: 0.7; font-size: 14px; max-width: 360px; }
    #reload-btn {
      margin-top: 8px;
      padding: 8px 20px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="frame-wrap">
    <iframe
      id="fc-frame"
      src="index.html"
      allow="microphone; clipboard-read; clipboard-write"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
    ></iframe>
  </div>

  <div id="error-msg">
    <strong>Could not load FlightCheck</strong>
    <p>FlightCheck panel failed to load. Try toggling the panel off and on again, or restart the sim.</p>
    <button id="reload-btn" onclick="reload()">Try again</button>
  </div>

  <script>
    var frame = document.getElementById('fc-frame');
    var errorDiv = document.getElementById('error-msg');

    frame.addEventListener('error', function () {
      frame.style.display = 'none';
      errorDiv.style.display = 'flex';
    });

    function reload() {
      errorDiv.style.display = 'none';
      frame.style.display = 'block';
      frame.src = frame.src;
    }
  </script>
</body>
</html>
