<!DOCTYPE html>
<html>
<head>
    <meta content="text/html; charset=utf-8" />
    <link rel="stylesheet" href="/SCSS/common.css" />

    <script type="text/javascript" src="/JS/coherent.js"></script>
    <script type="text/javascript" src="/JS/common.js"></script>
    <script type="text/javascript" src="/JS/dataStorage.js"></script>
    <script type="text/javascript" src="/JS/buttons.js"></script>
    <script type="text/javascript" src="/JS/Services/ToolBarPanels.js"></script>
    <script type="text/javascript" src="/Pages/VCockpit/Instruments/Shared/BaseInstrument.js"></script>

    <link rel="import" href="/templates/ingameUi/ingameUi.html" />
    <link rel="import" href="/templates/ingameUiHeader/ingameUiHeader.html" />

    <style>
        ingame-ui { width: 1100px; height: 750px; display: block; }
        /* height: 100% doesn't propagate through ingame-ui shadow DOM — JS sets explicit px below */
        iframe { width: 100%; height: 710px; border: none; display: block; }
    </style>
</head>
<body>
    <ingamepanel-custom>
        <ingame-ui id="CustomPanel" panel-id="PANEL_CUSTOM_PANEL" title="FlightCheck - Voice features at flightcheck.thefrog7272.workers.dev" content-fit="false" min-width="400" min-height="300">
            <iframe id="fc-frame" src="coui://html_ui/InstrumentsReact/FlightCheck/FlightCheck.html"></iframe>
        </ingame-ui>
    </ingamepanel-custom>
    <script>
        (function () {
            var TITLE_BAR_H = 40; // MSFS ingame-ui title bar height
            function fit() {
                var ui = document.getElementById('CustomPanel');
                var frame = document.getElementById('fc-frame');
                if (!ui || !frame) return;
                var h = ui.getBoundingClientRect().height || 750;
                if (h > 50) frame.style.height = (h - TITLE_BAR_H) + 'px';
            }
            [0, 100, 500].forEach(function (t) { setTimeout(fit, t); });
            window.addEventListener('resize', fit);
        })();
    </script>
</body>
</html>
