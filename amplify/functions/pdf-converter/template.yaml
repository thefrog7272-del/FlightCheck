AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FlightCheck PDF Converter — converts uploaded PDFs to structured checklist JSON

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 512

Resources:
  PdfConverterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: flightcheck-pdf-converter
      CodeUri: ./
      Handler: handler.lambda_handler
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - https://main.d2m1s5v9i0w5nr.amplifyapp.com
            - http://localhost:5173
          AllowMethods:
            - POST
          AllowHeaders:
            - content-type
    Metadata:
      BuildMethod: python3.12

Outputs:
  FunctionUrl:
    Description: >
      HTTPS endpoint for the PDF converter.
      Set this as VITE_PDF_CONVERTER_URL in Amplify Console > App settings > Environment variables,
      then trigger a redeploy.
    Value: !GetAtt PdfConverterFunctionUrl.FunctionUrl
